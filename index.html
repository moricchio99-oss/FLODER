  /* Content: full width, less padding */
  #CN{padding:14px 14px !important}
  /* Cards: single column, full width */
  .grid{grid-template-columns:1fr !important;gap:14px}
  .toolbar{gap:9px;margin-bottom:16px}
  .type-pills{gap:5px}
  .tpill{padding:6px 14px;font-size:13px}
  /* ============================================================
     DOCUMENT PAGE — MOBILE: rebuilt clean. The viewer is moved (via JS)
     INTO the info column right after the title, so source order is
     title → viewer → description → actions → author → stats/tags/comments.
     The info panel is a single full-width block with a uniform 16px side
     padding, so EVERY child — including the viewer — shares the exact
     same width. No sticky, no grid, no per-element gutters.
     ============================================================ */
  #DP_GRID{display:flex !important;flex-direction:column !important;grid-template-columns:none !important;background:#fff}
  /* The original viewer wrapper slot is now empty (viewer moved into info) */
  #DP_GRID > div:first-child:empty{display:none !important}

  /* Info panel: full-width block, uniform 16px gutter, no sticky */
  .dp-info{padding:18px 16px 28px !important;background:#fff !important;display:flex !important;flex-direction:column !important;gap:0 !important;position:static !important;max-height:none !important;overflow:visible !important;width:100% !important}

  .dp-head{display:flex !important;flex-direction:column !important;align-items:flex-start !important}

     text Back button; the body of the page now starts straight with the title. */
  .nav-back{display:none !important}

  .dp-info h1{font-size:23px !important;line-height:1.22 !important;margin:11px 0 8px !important;letter-spacing:-0.3px}
  .dp-desc{margin:0 0 18px !important;font-size:13.5px !important;line-height:1.55 !important}

  /* The dark viewer: now a normal child of .dp-info → already inset 16px
     each side by the panel padding. Centered, framed, full usable width. */
  #DP_VIEWER{min-height:0 !important;width:100% !important;align-items:stretch !important;border-radius:16px !important;overflow:hidden !important;background:#f0eee9 !important;border:1px solid #e5e2db !important;box-shadow:none !important;display:flex !important;flex-direction:column !important;margin:0 !important}
  #DP_VIEWER div{min-height:0 !important}

  /* PPT slide area: centered, full width, breathing room */
  .slides-main{padding:10px 10px 12px !important;height:auto !important;flex-direction:column !important;gap:12px !important;display:flex !important;align-items:center !important;justify-content:center !important;width:100% !important}
  #slide_navpill{position:static !important;transform:none !important;bottom:auto !important;align-self:center}
  .slides-thumbs{display:none !important}

  /* actions */
  .dp-actions{background:#fff !important;padding:0 !important;margin:18px 0 0 !important;gap:9px !important;display:flex !important}
  .dp-actions > a{padding:13px !important;border-radius:11px !important;font-size:14px !important;font-weight:650 !important;box-shadow:0 1px 2px rgba(15,113,115,0.25)}
  .dp-actions > button{width:46px;height:46px;padding:0 !important;border-radius:11px !important;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff !important;border:1px solid var(--bor) !important}
  .dp-actions > button svg{width:17px !important;height:17px !important}

  /* author */
  .dp-author{margin:20px 0 0 !important;padding:20px 0 0 !important;background:#fff !important;border:none !important;border-top:1px solid var(--bor) !important;border-radius:0 !important}

  /* footer */
  .dp-foot{background:#fff !important;padding:20px 0 0 !important;margin:0 !important;gap:20px !important}
  .dp-foot > div:first-child{border-top:none !important;padding-top:0 !important}

  /* Cards (feed) */
  .cth{height:220px !important}
  .ctitle{font-size:15px !important;min-height:auto !important}
  .can{font-size:13px !important}
  .cm{font-size:12px !important}

  .cfb svg{width:12px !important;height:12px !important}
  .ma{padding:11px !important;font-size:13px !important}
}

<script>
// ── SUPABASE CONFIG ──
const SUPABASE_URL = 'https://anfqwtiugwknlcidbdzh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e7q72bBIfa98OJEOssnB7g_3MbAsBp3';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── STATO APP ──
const S = {
  user: null,
  profile: null,
  page: 'home',
  tf: 'all',
  sort: 'recent',
  search: '',
  vu: null,
  tags: [],
  uploadType: 'word',
  docId: null,
};
const PG = {};
const PAGE_SIZE = 18;
let suid = 0;

// ── URL ROUTING ──
function parseUrl() {
  const path = window.location.pathname;
  const m = path.match(/^\/d\/([\w-]+)$/);
  if(m) {
    S.page = 'doc';
    S.docId = m[1];
  } else {
    if(S.page === 'doc') { S.page = 'home'; S.docId = null; }
  }
}

window.addEventListener('popstate', () => {
  parseUrl();
  window.scrollTo(0, 0);
  render();
});

// ── INIT ──
async function init() {
  console.log('%cFileSilver build: mobile-doc-v2 (viewer altezza adattiva)', 'color:#0f7173;font-weight:bold');
  parseUrl();
  const { data: { session } } = await sb.auth.getSession();
  if (session) await loadProfile(session.user);
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session) {
      await loadProfile(session.user);
    } else {
      S.user = null;
      S.profile = null;
    }
    render();
  });
  render();
}

async function loadProfile(user) {
  S.user = user;
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  S.profile = data;
}

// ── ICONS ──
const I = {

  bookmark: `<path d="M3 2h10a1 1 0 011 1v11l-6-3-6 3V3a1 1 0 011-1z"/>`,

  comment: `<path d="M14 8c0 3-2.7 5.5-6 5.5a6.2 6.2 0 01-2.4-.5L2 14.5l.5-3.5A5.4 5.4 0 012 8c0-3 2.7-5.5 6-5.5S14 5 14 8z"/>`,
  eye: `<path d="M1 8s2.5-5.5 7-5.5S15 8 15 8s-2.5 5.5-7 5.5S1 8 1 8z"/><circle cx="8" cy="8" r="2"/>`,
  clock: `<circle cx="8" cy="8" r="6"/><polyline points="8,4.5 8,8 10.5,10"/>`,
  close: `<line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/>`,

  savi: `<path d="M3 2h10a1 1 0 011 1v11l-6-3-6 3V3a1 1 0 011-1z"/>`,

  share: `<circle cx="14" cy="3" r="1.5"/><circle cx="14" cy="13" r="1.5"/><circle cx="2" cy="8" r="1.5"/><line x1="3.5" y1="8.9" x2="12.5" y2="12.1"/><line x1="12.5" y1="3.9" x2="3.5" y2="7.1"/>`,

};
function ic(n, w=14, x='') {

}

const LOGO_MARK = `<svg viewBox="0 0 48 34" fill="none" style="width:48px;height:34px;flex-shrink:0"><g transform="translate(0,0) rotate(-12,10,18)"><rect x="1" y="10" width="22" height="15" rx="2" fill="#a8d4d5"/><rect x="1" y="10" width="9" height="3" rx="1" fill="#8fc4c5"/></g><g transform="translate(4,2) rotate(-3,14,18)"><rect x="6" y="12" width="22" height="15" rx="2" fill="#4fa8aa"/><rect x="6" y="12" width="9" height="3" rx="1" fill="#3d9799"/></g><g transform="translate(8,4) rotate(7,18,20)"><rect x="11" y="14" width="22" height="15" rx="2" fill="#0f7173"/><rect x="11" y="14" width="9" height="3" rx="1" fill="#0a5f61"/><line x1="14" y1="23" x2="30" y2="23" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/><line x1="14" y1="27" x2="26" y2="27" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.28"/></g></svg>`;

// ── TOAST ──
function toast(msg, ok) {
  const w = document.getElementById('TW'), el = document.createElement('div');
  el.className = 'tw2';
  el.style.background = ok ? '#0f7173' : ok === false ? '#dc2626' : '#18170f';

// ── AVATAR HELPER ──
function avEl(profile, sz) {
  if (!profile) return `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#ccc;flex-shrink:0"></div>`;
  const s = `width:${sz}px;height:${sz}px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:${Math.floor(sz*.34)}px;font-weight:700;color:#fff;flex-shrink:0;background:#0f7173`;
  const ini = (profile.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return profile.avatar_url
    ? `<div style="${s}"><img src="${profile.avatar_url}" style="width:100%;height:100%;object-fit:cover"></div>`
    : `<div style="${s}">${ini}</div>`;
}

// ── THUMBNAILS ──
function thumb(t) {
  if(t==='word') return `<div class="pw"><div class="pwt"></div><div class="pwl f"></div><div class="pwl m"></div><div class="pwl f"></div><div class="pwl s"></div><div class="pwg"></div><div class="pwb"></div><div class="pwl f"></div><div class="pwl m"></div></div>`;
  if(t==='excel') return `<div class="pe"><div class="peh"><div class="pehc"></div><div class="pehc"></div><div class="pehc"></div><div class="pehc"></div></div>${['80%','55%','70%','45%','65%','50%'].map(h=>`<div class="per"><div class="pec"><div class="pev" style="width:75%"></div></div><div class="pec"><div class="pebar" style="height:${h}"></div></div><div class="pec"><div class="pebar" style="height:${parseInt(h)*.7+'%'}"></div></div><div class="pec"><div class="pebar" style="height:${parseInt(h)*.9+'%'}"></div></div></div>`).join('')}</div>`;
  if(t==='ppt') return `<div class="pp"><div class="ppa"></div><div class="ppt2"></div><div class="pps"></div><div class="ppl" style="width:68%"></div><div class="ppl" style="width:52%"></div><div class="ppl" style="width:60%"></div></div>`;

function extOf(t) { return {word:'docx',excel:'xlsx',ppt:'pptx',pdf:'pdf'}[t]||'' }
function ftOf(t) { return {word:'Word Document',excel:'Excel Spreadsheet',ppt:'PowerPoint',pdf:'PDF Document'}[t]||'' }
function bdgOf(t) { return {word:'WORD',excel:'EXCEL',ppt:'PPT',pdf:'PDF'}[t]||'' }

// ── CARD ──
function card(doc, animated=false) {
  const p = doc.profiles || {};

function timeAgo(ts) {
  const d = Math.floor((Date.now() - new Date(ts)) / 1000);
  if(d<60) return 'just now';
  if(d<3600) return Math.floor(d/60)+'m ago';
  if(d<86400) return Math.floor(d/3600)+'h ago';
  return Math.floor(d/86400)+'d ago';
}

// ── PAGINATED GRID ──
function pgKey() { return `${S.page}:${S.tf}:${S.sort}:${S.search}`; }
function getVis(k) { return PG[k] || PAGE_SIZE; }

function paginatedGrid(docs, prefix) {
  const key = `${prefix}:${pgKey()}`;
  const vis = getVis(key);
  const shown = docs.slice(0, vis);
  const prevVis = vis - PAGE_SIZE;
  const html = shown.map((d,i) => card(d, i >= prevVis && prevVis > 0)).join('');
  let lm = '';
  if(shown.length < docs.length) {
    const rem = docs.length - shown.length;
    lm = `<div class="load-more-wrap">
      <div class="load-more-bar"></div>
      <div class="load-more-info">Showing <strong>${shown.length}</strong> of <strong>${docs.length}</strong></div>
      <button class="btn-load" id="lm_${key}" onclick="doLoadMore('${key}')">
        ${ic('refresh',13)} Load ${Math.min(PAGE_SIZE,rem)} more
      </button>
    </div>`;
  }
  return `<div class="grid">${html}</div>${lm}`;
}

function doLoadMore(key) {
  const btn = document.getElementById('lm_'+key);
  if(btn){btn.classList.add('loading');btn.disabled=true;}
  setTimeout(()=>{ PG[key]=(PG[key]||PAGE_SIZE)+PAGE_SIZE; buildCN(); }, 350);
}

// ── FETCH DOCS ──
async function fetchDocs(filters={}) {
  let q = sb.from('documents')
    .select('*, profiles(id,name,avatar_url), likes(user_id), saves:document_saves(user_id), comments(id)')
    .order('created_at', {ascending: false});
  if(filters.type && filters.type !== 'all') q = q.eq('file_type', filters.type);
  if(filters.search) q = q.ilike('title', `%${filters.search}%`);
  if(filters.user_id) q = q.eq('user_id', filters.user_id);
  const { data, error } = await q;
  if(error) { console.error(error); return []; }
  let docs = data || [];
  if(filters.sort === 'views') docs.sort((a,b) => (b.views||0)-(a.views||0));
  if(filters.sort === 'likes') docs.sort((a,b) => (b.likes?.length||0)-(a.likes?.length||0));
  if(filters.saved && S.user) docs = docs.filter(d => (d.saves||[]).some(s=>s.user_id===S.user.id));
  return docs;
}

// ── MAIN RENDER ──
async function render() {
  try {
    buildNav();
  } catch(e) { console.error('[FileSilver] buildNav error:', e); }
  try {
    await buildApp();
  } catch(e) {
    console.error('[FileSilver] buildApp error:', e);
    // Recovery: if rendering broke, force a clean home view so the page never stays blank
    try {
      if(S.page !== 'home') {
        S.page = 'home'; S.docId = null;
        await buildApp();
      }
    } catch(e2) { console.error('[FileSilver] recovery failed:', e2); }
  }
  setTimeout(initLazyPreviews, 100);
}

async function buildApp() {
  const app = document.getElementById('APP');
  // Toggle body class so the floating menu button hides on document pages
  document.body.classList.toggle('page-doc', S.page === 'doc' && !!S.docId);
  // Document page - full layout, no sidebar
  if(S.page === 'doc' && S.docId) {
    app.innerHTML = `<div id="DOC_PAGE"></div>`;
    await buildDocPage(S.docId);
    return;
  }
  // tutti possono vedere il feed
  if(false) {
    app.innerHTML = landingHTML();
    return;
  }
  app.innerHTML = `<div style="display:flex"><div class="sb-overlay" onclick="closeSidebar()"></div><div id="SB_WRAP"></div><div id="CN" style="flex:1;min-width:0;padding:20px 24px"></div></div>`;
  const docs = await fetchDocs({ type: S.tf, search: S.search, sort: S.sort });
  const counts = { all: docs.length };
  ['word','excel','ppt','pdf'].forEach(t => counts[t] = docs.filter(d=>d.file_type===t).length);
  document.getElementById('SB_WRAP').innerHTML = buildSB(counts);
  const cn = document.getElementById('CN');
  if(!cn) return;
  if(S.page === 'profile') { cn.innerHTML = await profHTML(); return; }
  if(S.page === 'user') { cn.innerHTML = await userHTML(S.vu); return; }
  if(S.page === 'trending') {
    const sorted = [...docs].sort((a,b)=>(b.views||0)-(a.views||0));
    cn.innerHTML = `<div class="sec"><div class="sch">Trending — all time</div>${paginatedGrid(sorted,'trend')}</div>`;
    return;
  }
  if(S.page === 'explore') {
    const sorted = [...docs].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    cn.innerHTML = `<div class="sec"><div class="sch">Explore all documents</div>${sorted.length?paginatedGrid(sorted,'explore'):`<div class="emp">${ic('file',28)}<p>No documents yet.</p></div>`}</div>`;
    return;
  }
  if(S.page === 'saved') {
    const saved = docs.filter(d=>(d.saves||[]).some(s=>s.user_id===S.user.id));
    cn.innerHTML = `<div class="sec"><div class="sch">Saved <small>${saved.length}</small></div>${saved.length?paginatedGrid(saved,'saved'): `<div class="emp">${ic('bookmark',28)}<p>Nothing saved yet.</p></div>`}</div>`;
    return;
  }
  // Home — single unified feed, respects the sort toggle (Recent / Most viewed / Most liked)
  let html = toolbar();
  const heading = S.search ? 'Search results'
    : S.tf !== 'all' ? 'Filtered results'
    : S.sort === 'views' ? 'Most viewed'
    : S.sort === 'likes' ? 'Most liked'
    : 'Latest documents';
  html += `<div class="sec"><div class="sch">${heading}</div>${docs.length?paginatedGrid(docs,'feed'):`<div class="emp">${ic('file',28)}<p>No documents yet. Be the first to upload!</p></div>`}</div>`;
  cn.innerHTML = html;
}

        <button onclick="shareDoc()" style="background:#fff;color:var(--tx);border:1px solid var(--bor);padding:10px 13px;border-radius:9px;font-size:13px;cursor:pointer" aria-label="share">${ic('open',14)}</button>
      </div>
      
      <div class="dp-author" onclick="goUser('${doc.user_id}')" style="display:flex;align-items:center;gap:11px;padding:11px;background:var(--sur2);border-radius:9px;cursor:pointer">
        <div class="cav3" style="${p.avatar_url?'background:transparent':'background:#0f7173'};width:36px;height:36px;font-size:13px">${p.avatar_url?`<img src="${p.avatar_url}">`:`${ini}`}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--tx)">${p.name||'Unknown'}</div>
          <div style="font-size:11.5px;color:var(--tx2)">${timeAgo(doc.created_at)}</div>
        </div>
        <span style="color:var(--ac);font-size:11.5px;font-weight:500">View profile →</span>
      </div>
      
      <div class="dp-foot" style="display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;gap:18px;padding:13px 0;border-top:1px solid var(--bor);border-bottom:1px solid var(--bor)">
        <div>
          <div style="font-size:10.5px;color:var(--tx3);font-weight:600;letter-spacing:1px">VIEWS</div>
          <div style="font-size:17px;font-weight:700;color:var(--tx);margin-top:2px">${(doc.views||0).toLocaleString()}</div>
        </div>
        <div>
          <div style="font-size:10.5px;color:var(--tx3);font-weight:600;letter-spacing:1px">LIKES</div>
          <div style="font-size:17px;font-weight:700;color:var(--tx);margin-top:2px">${doc.likes?.length||0}</div>
        </div>
        <div>
          <div style="font-size:10.5px;color:var(--tx3);font-weight:600;letter-spacing:1px">COMMENTS</div>
          <div style="font-size:17px;font-weight:700;color:var(--tx);margin-top:2px">${doc.comments?.length||0}</div>
        </div>

        <div style="font-size:10.5px;color:var(--tx3);font-weight:600;letter-spacing:1px;margin-bottom:8px">TAGS</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${tagsHtml}</div>

      <div>
        <div style="font-size:13px;font-weight:700;color:var(--tx);margin-bottom:12px;display:flex;align-items:center;gap:6px">

        ${cmts||`<div style="padding:14px;text-align:center;color:var(--tx3);font-size:12px">No comments yet.</div>`}
        ${inr}
      </div>
      </div>
    </div>
  </div>
  
  <style>
    @media (max-width:900px) {
      #DP_GRID { grid-template-columns: 1fr !important; }
    }
  </style>`;
  
  const viewer = document.getElementById('DP_VIEWER');
  // MOBILE: physically move the dark viewer INTO the info column, right
  // after the title block. Source order becomes title→viewer→rest, so every
  // block (viewer included) shares the info panel's uniform 16px gutter and
  // the viewer is centered full-width. We move #DP_VIEWER itself (not its
  // outer #2a2a2a wrapper) so there's no double background.
  if(window.innerWidth <= 760 && viewer) {
    const outerWrap = viewer.parentElement;          // empty #2a2a2a frame left behind
    const info = document.querySelector('.dp-info');
    const head = document.querySelector('.dp-head');
    if(info && head) {
      info.insertBefore(viewer, head.nextSibling);
      if(outerWrap) outerWrap.style.display = 'none';
    }
  }
  if(viewer) {
    const isSupabase = doc.file_url && doc.file_url.indexOf('supabase.co/storage') !== -1;
    if(doc.file_type === 'pdf' && isSupabase) {
      renderPdfFull(viewer, doc.file_url);
    } else if(doc.file_type === 'excel' && isSupabase) {
      renderExcelViewer(viewer, doc.file_url);
    } else if(['word','ppt'].includes(doc.file_type) && isSupabase) {
      renderOfficeAsPdf(viewer, doc.file_url, doc.file_name, doc.file_type, doc.thumbnail_url);
    } else if(doc.thumbnail_url) {
      renderThumbnailImage(viewer, doc.thumbnail_url, doc.file_type);
    } else {
      renderStyledCard(viewer, doc.file_type);
    }
  }
}

// ── FULL PDF VIEWER — single-page on mobile (like PPT), scroll on desktop ──
async function renderPdfFull(container, url) {
  container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:200px;color:#9a958a;font-size:13px">Loading document…</div>`;
  if(typeof pdfjsLib === 'undefined') {
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:200px;color:#9a958a;font-size:13px">Preview unavailable</div>`;
    return;
  }
  try {
    const pdf = await pdfjsLib.getDocument(url).promise;
    const total = pdf.numPages;
    let current = 1;
    const isMobile = window.innerWidth <= 760;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    if(isMobile) {
      // ---- MOBILE: one page at a time, paged with ‹ ›, compact pill ----
      container.innerHTML = `
        <div style="padding:12px 12px 0;display:flex;flex-direction:column;align-items:center;width:100%">
          <canvas id="pdf_canvas" style="width:100%;max-width:100%;border-radius:4px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.14);display:block"></canvas>
        </div>
        <div id="pdf_navbar" style="align-self:center;margin:12px auto 12px;background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:30px;color:#fff;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,0.22)">
          <button id="pdf_prev" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0">‹</button>
          <span id="pdf_counter" style="min-width:84px;text-align:center;font-weight:500">Page ${current} of ${total}</span>
          <button id="pdf_next" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0">›</button>
        </div>`;
      const canvas = container.querySelector('#pdf_canvas');
      const counter = container.querySelector('#pdf_counter');
      const prevBtn = container.querySelector('#pdf_prev');
      const nextBtn = container.querySelector('#pdf_next');

      const renderPage = async (n) => {
        current = Math.max(1, Math.min(total, n));
        const page = await pdf.getPage(current);
        const wrapW = (canvas.parentElement.clientWidth || (window.innerWidth - 56));
        const base = page.getViewport({ scale: 1 });
        const scale = (wrapW / base.width) * dpr;
        const vp = page.getViewport({ scale });
        canvas.width = vp.width;
        canvas.height = vp.height;
        canvas.style.height = (vp.height / dpr) + 'px';
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        counter.textContent = `Page ${current} of ${total}`;
        prevBtn.style.opacity = current === 1 ? '0.35' : '1';
        nextBtn.style.opacity = current === total ? '0.35' : '1';
      };
      prevBtn.onclick = () => { if(current > 1) renderPage(current - 1); };
      nextBtn.onclick = () => { if(current < total) renderPage(current + 1); };
      await renderPage(1);
      return;
    }

    // ---- DESKTOP: all pages stacked, natural scroll (unchanged) ----
    const pad = 24;
    container.innerHTML = `
      <div id="pdf_pages" style="width:100%;padding:${pad}px;display:flex;flex-direction:column;align-items:center;gap:20px"></div>
      <div style="position:fixed;bottom:24px;z-index:50;background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:30px;color:#fff;font-size:12.5px;box-shadow:0 4px 20px rgba(0,0,0,0.35)" id="pdf_navbar">
        <button id="pdf_prev" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0">‹</button>
        <span id="pdf_counter" style="min-width:84px;text-align:center;font-weight:500">Page ${current} of ${total}</span>
        <button id="pdf_next" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0">›</button>
      </div>`;
    const pagesBox = container.querySelector('#pdf_pages');
    const counter = container.querySelector('#pdf_counter');
    const navbar = container.querySelector('#pdf_navbar');
    const centerNav = () => {
      if(!navbar || !document.body.contains(navbar)) { window.removeEventListener('resize', centerNav); return; }
      navbar.style.position = 'fixed';
      navbar.style.bottom = '24px';
      const r = container.getBoundingClientRect();
      navbar.style.left = (r.left + r.width / 2) + 'px';
      navbar.style.transform = 'translateX(-50%)';
    };
    window.addEventListener('resize', centerNav);
    requestAnimationFrame(centerNav);

    let availWidth = pagesBox.clientWidth - pad * 2;
    if(availWidth < 200) availWidth = Math.min(window.innerWidth, 820) - pad * 2;
    const targetWidth = Math.min(availWidth, 820);

    for(let n = 1; n <= total; n++) {
      const page = await pdf.getPage(n);
      const baseViewport = page.getViewport({ scale: 1 });
      const scale = (targetWidth / baseViewport.width) * dpr;
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = (viewport.width / dpr) + 'px';
      canvas.style.height = (viewport.height / dpr) + 'px';
      canvas.style.maxWidth = '100%';
      canvas.style.boxShadow = '0 8px 40px rgba(0,0,0,0.4)';
      canvas.style.borderRadius = '3px';
      canvas.style.background = '#fff';
      canvas.dataset.page = n;
      pagesBox.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    }
    const onScroll = () => {
      if(!document.body.contains(pagesBox)) { window.removeEventListener('scroll', onScroll); return; }
      const canvases = pagesBox.querySelectorAll('canvas');
      let visiblePage = 1;
      canvases.forEach(c => { if(c.getBoundingClientRect().top <= 200) visiblePage = parseInt(c.dataset.page); });
      current = visiblePage;
      counter.textContent = `Page ${current} of ${total}`;
    };
    window.addEventListener('scroll', onScroll);
    const goToPage = (n) => {
      n = Math.max(1, Math.min(total, n));
      current = n;
      const target = pagesBox.querySelector(`canvas[data-page="${n}"]`);
      if(target) { const y = target.getBoundingClientRect().top + window.scrollY - 110; window.scrollTo({ top: y, behavior: 'smooth' }); }
      counter.textContent = `Page ${current} of ${total}`;
    };
    container.querySelector('#pdf_prev').onclick = () => goToPage(current - 1);
    container.querySelector('#pdf_next').onclick = () => goToPage(current + 1);
  } catch(err) {
    console.warn('[FileSilver] PDF full render failed:', err.message || err);
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:200px;color:#9a958a;font-size:13px;text-align:center;padding:40px">Could not load preview.<br>Try downloading the file instead.</div>`;
  }
}

// ── OFFICE → PDF (via CloudConvert Edge Function, then PDF.js viewer) ──
async function renderOfficeAsPdf(container, fileUrl, fileName, ftype, thumbUrl) {
  container.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:calc(100vh - 54px);color:rgba(255,255,255,0.6);font-size:13px;gap:14px">
    <div style="width:30px;height:30px;border:3px solid rgba(255,255,255,0.2);border-top-color:rgba(255,255,255,0.7);border-radius:50%;animation:spin 0.8s linear infinite"></div>
    <div style="text-align:center;line-height:1.6">Preparing preview…<br><span style="font-size:11px;color:rgba(255,255,255,0.4)">First view may take a few seconds</span></div>
  </div>`;

  const callConvert = async () => {
    const resp = await fetch(`${SUPABASE_URL}/functions/v1/convert-to-pdf`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      },
      body: JSON.stringify({ fileUrl, fileName }),
    });
    return resp.json();
  };

  const showPdf = (pdfUrl) => {
    if(ftype === 'ppt') renderSlidesViewer(container, pdfUrl);
    else renderPdfFull(container, pdfUrl);
  };

  try {
    let data = await callConvert();
    // Retry once if the first attempt didn't return a URL (conversion may still be finishing)
    if(!data.pdfUrl) {
      console.warn('[FileSilver] First convert attempt no URL, retrying in 4s…', data.error || data);
      await new Promise(r => setTimeout(r, 4000));
      data = await callConvert();
    }
    if(data.pdfUrl) {
      showPdf(data.pdfUrl);
    } else {
      console.warn('[FileSilver] Office→PDF conversion failed after retry:', data.error || data);
      renderOfficeViewer(container, fileUrl, ftype, thumbUrl);
    }
  } catch(err) {
    console.warn('[FileSilver] Office→PDF error:', err.message || err);
    renderOfficeViewer(container, fileUrl, ftype, thumbUrl);
  }
}

// ── SLIDES VIEWER (PPT → PDF, one slide at a time + thumbnail strip) ──
async function renderSlidesViewer(container, url) {
  if(typeof pdfjsLib === 'undefined') { renderPdfFull(container, url); return; }
  container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:calc(100vh - 54px);color:rgba(255,255,255,0.5);font-size:13px;gap:10px">
    <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,0.2);border-top-color:rgba(255,255,255,0.7);border-radius:50%;animation:spin 0.8s linear infinite"></div>
    Loading slides…
  </div>`;
  try {
    const pdf = await pdfjsLib.getDocument(url).promise;
    const total = pdf.numPages;
    let current = 1;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const isMob = window.innerWidth <= 760;
    const rowMinH = isMob ? '' : 'min-height:calc(100vh - 54px)';

    container.innerHTML = `
      <div style="display:flex;width:100%;${isMob?'':'height:100%;'}${rowMinH}">
        <!-- Thumbnail strip (left) -->
        <div id="slide_thumbs" class="slides-thumbs" style="width:118px;flex-shrink:0;background:rgba(0,0,0,0.22);overflow-y:auto;padding:12px 9px;display:flex;flex-direction:column;gap:9px;max-height:calc(100vh - 54px)"></div>
        <!-- Main slide area -->
        <div id="slide_area" class="slides-main" style="flex:1;display:flex;align-items:center;justify-content:center;padding:28px;position:relative;min-width:0;${rowMinH}">
          <canvas id="slide_main" style="box-shadow:0 10px 50px rgba(0,0,0,0.5);border-radius:4px;background:#fff;display:block"></canvas>
          <!-- Floating nav pill (centered on the slide area) -->
          <div id="slide_navpill" style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(0,0,0,0.78);backdrop-filter:blur(10px);display:flex;align-items:center;gap:14px;padding:9px 14px;border-radius:30px;color:#fff;font-size:12.5px;box-shadow:0 4px 20px rgba(0,0,0,0.35)">
            <button id="slide_prev" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">‹</button>
            <span id="slide_counter" style="min-width:90px;text-align:center;font-weight:500">Slide ${current} of ${total}</span>
            <button id="slide_next" style="background:rgba(255,255,255,0.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center">›</button>
          </div>
        </div>
      </div>
    `;

    const mainCanvas = container.querySelector('#slide_main');
    const counter = container.querySelector('#slide_counter');
    const thumbsBox = container.querySelector('#slide_thumbs');

    // Render the big main slide — fit to available space, preserve aspect ratio
    const slideArea = container.querySelector('#slide_area');
    const renderMain = async (n) => {
      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const aspect = base.width / base.height;
      // Available space in the main area (minus actual padding)
      const cs = getComputedStyle(slideArea);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      const availW = slideArea.clientWidth - padX;
      const availH = slideArea.clientHeight - padY;
      const isMobileSlide = window.innerWidth <= 760;
      // Fit within both constraints
      let dispW = availW;
      let dispH = dispW / aspect;
      if(isMobileSlide) {
        // On mobile the viewer hugs its content, so size the slide purely by the
        // available width — the container grows to match. No giant black gap.
        dispW = availW;
        dispH = dispW / aspect;
      } else {
        if(dispH > availH) { dispH = availH; dispW = dispH * aspect; }
      }
      // Render at higher res for sharpness
      const scale = (dispW / base.width) * dpr;
      const viewport = page.getViewport({ scale });
      mainCanvas.width = viewport.width;
      mainCanvas.height = viewport.height;
      mainCanvas.style.width = dispW + 'px';
      mainCanvas.style.height = dispH + 'px';
      await page.render({ canvasContext: mainCanvas.getContext('2d'), viewport }).promise;
      counter.textContent = `Slide ${n} of ${total}`;
    };

    // Highlight active thumbnail
    const updateThumbHighlight = () => {
      thumbsBox.querySelectorAll('[data-thumb]').forEach(t => {
        const active = parseInt(t.dataset.thumb) === current;
        t.style.outline = active ? '2px solid #0f7173' : '2px solid transparent';
        t.style.opacity = active ? '1' : '0.62';
      });
    };

    const goTo = async (n) => {
      current = Math.max(1, Math.min(total, n));
      await renderMain(current);
      updateThumbHighlight();
      const active = thumbsBox.querySelector(`[data-thumb="${current}"]`);
      if(active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };

    container.querySelector('#slide_prev').onclick = () => goTo(current - 1);
    container.querySelector('#slide_next').onclick = () => goTo(current + 1);
    // Keyboard arrows
    const keyHandler = (e) => {
      // Auto-detach if this slide viewer is no longer in the DOM
      if(!document.body.contains(mainCanvas)) {
        document.removeEventListener('keydown', keyHandler);
        return;
      }
      if(e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
      if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1);
    };
    document.addEventListener('keydown', keyHandler);

    // Wait for layout to settle, then render the main slide at correct size
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    await renderMain(1);
    // Re-render on window resize to keep it fitted
    let resizeT;
    const onResize = () => {
      if(!document.body.contains(mainCanvas)) { window.removeEventListener('resize', onResize); return; }
      clearTimeout(resizeT);
      resizeT = setTimeout(() => renderMain(current), 150);
    };
    window.addEventListener('resize', onResize);

    // Then build thumbnails progressively
    for(let n = 1; n <= total; n++) {
      const wrap = document.createElement('div');
      wrap.dataset.thumb = n;
      wrap.style.cssText = 'cursor:pointer;border-radius:4px;overflow:hidden;flex-shrink:0;outline:2px solid transparent;transition:opacity 0.15s,outline 0.15s;position:relative;background:#fff';
      wrap.style.opacity = n === 1 ? '1' : '0.62';
      if(n === 1) wrap.style.outline = '2px solid #0f7173';
      const tc = document.createElement('canvas');
      tc.style.cssText = 'width:100%;display:block';
      wrap.appendChild(tc);
      const label = document.createElement('div');
      label.textContent = n;
      label.style.cssText = 'position:absolute;bottom:3px;right:4px;background:rgba(0,0,0,0.55);color:#fff;font-size:8.5px;padding:1px 4px;border-radius:3px';
      wrap.appendChild(label);
      wrap.onclick = () => goTo(n);
      thumbsBox.appendChild(wrap);

      const page = await pdf.getPage(n);
      const base = page.getViewport({ scale: 1 });
      const tScale = (96 / base.width) * dpr;
      const tv = page.getViewport({ scale: tScale });
      tc.width = tv.width;
      tc.height = tv.height;
      tc.style.height = (tv.height / dpr) + 'px';
      await page.render({ canvasContext: tc.getContext('2d'), viewport: tv }).promise;
    }
  } catch(err) {
    console.warn('[FileSilver] Slides render failed:', err.message || err);
    renderPdfFull(container, url);
  }
}

// ── OFFICE VIEWER (Microsoft Office Online — fallback) ──
function renderOfficeViewer(container, url, ftype, thumbUrl) {
  // wdHideGridlines, wdHideHeaders, wdAllowInteractivity keep it as a clean reader
  const officeUrl = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(url) + '&wdAllowInteractivity=False&wdHideGridlines=True&wdHideHeaders=True';
  container.innerHTML = `
    <div style="width:100%;flex:1;position:relative;min-height:calc(100vh - 54px);background:#2a2a2a;overflow:hidden">
      <div id="office_loading" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,0.6);font-size:13px;gap:10px;z-index:1">
        <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,0.2);border-top-color:rgba(255,255,255,0.7);border-radius:50%;animation:spin 0.8s linear infinite"></div>
        Loading document…
      </div>

// ── EXCEL VIEWER (SheetJS — native rendering in browser) ──
async function renderExcelViewer(container, url) {
  container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:calc(100vh - 54px);color:rgba(255,255,255,0.5);font-size:13px;gap:10px;flex-direction:column">
    <div style="width:28px;height:28px;border:3px solid rgba(255,255,255,0.2);border-top-color:rgba(255,255,255,0.7);border-radius:50%;animation:spin 0.8s linear infinite"></div>
    Loading spreadsheet…
  </div>`;
  if(typeof XLSX === 'undefined') {
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:calc(100vh - 54px);color:rgba(255,255,255,0.5);font-size:13px">Preview unavailable</div>`;
    return;
  }
  try {
    const resp = await fetch(url);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellFormula: true, cellNF: true });
    const sheetNames = wb.SheetNames;
    let activeSheet = 0;

    const colLabel = (n) => {
      let s = '';
      n = n + 1;
      while(n > 0) { let m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
      return s;
    };

    const isMobileXls = window.innerWidth <= 760;
    const baseColW = isMobileXls ? 52 : 90;   // narrower columns on phones → more columns visible
    const minColW = isMobileXls ? 34 : 48;
    const cellFont = isMobileXls ? 11 : 12.5;

    const buildSheetTable = (idx) => {
      const ws = wb.Sheets[sheetNames[idx]];
      const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
      // Find the real extent of actual content (some templates declare a huge
      // !ref full of empty cells, which renders as an ugly empty grid).
      let lastRow = 0, lastCol = 0;
      for(let r = range.s.r; r <= range.e.r; r++) {
        for(let c = range.s.c; c <= range.e.c; c++) {
          const cell = ws[XLSX.utils.encode_cell({ r, c })];
          if(cell && cell.v !== undefined && cell.v !== null && String(cell.v).trim() !== '') {
            if(r > lastRow) lastRow = r;
            if(c > lastCol) lastCol = c;
          }
        }
      }
      // Add a small padding of empty cells so it still looks like a spreadsheet,
      // but cap it tightly so we don't render hundreds of blank rows/cols.
      const maxCol = Math.min(range.e.c, lastCol + 1);
      const maxRow = Math.min(range.e.r, lastRow + 2);
      const colWidths = (ws['!cols'] || []).map(c => c && c.wch ? c.wch : null);
      const merges = ws['!merges'] || [];
      const isMerged = (r, c) => merges.find(m => r>=m.s.r && r<=m.e.r && c>=m.s.c && c<=m.e.c);
      const isMergeHead = (r, c) => merges.find(m => r===m.s.r && c===m.s.c);
      // Detect which columns are entirely empty (within the content range) so we
      // can render them narrow and not waste horizontal space, especially on mobile.
      const colHasContent = [];
      for(let c = 0; c <= maxCol; c++) {
        let has = false;
        for(let r = 0; r <= maxRow; r++) {
          const cell = ws[XLSX.utils.encode_cell({ r, c })];
          if(cell && cell.v !== undefined && cell.v !== null && String(cell.v).trim() !== '') { has = true; break; }
        }
        colHasContent[c] = has;
      }
      const widthOf = (c) => {
        if(!colHasContent[c]) return isMobileXls ? 18 : 34;   // empty column → thin
        return colWidths[c] ? Math.max(minColW, colWidths[c]*(isMobileXls?4.2:7)) : baseColW;
      };

      let html = `<table style="border-collapse:collapse;font-size:${cellFont}px;font-family:-apple-system,sans-serif;background:#fff;width:100%">`;
      // Header row with column letters
      html += '<thead><tr><th style="background:#f1f0ec;border:1px solid #d8d5cd;min-width:34px;height:22px;position:sticky;top:0;left:0;z-index:3"></th>';
      for(let c = 0; c <= maxCol; c++) {
        const w = widthOf(c);
        html += `<th style="background:#f1f0ec;border:1px solid #d8d5cd;font-weight:600;color:#6b6758;font-size:11px;height:22px;min-width:${w}px;max-width:${w}px;position:sticky;top:0;z-index:2">${colLabel(c)}</th>`;
      }
      html += '<th style="background:#f1f0ec;border:1px solid #d8d5cd;height:22px;width:auto;position:sticky;top:0;z-index:2"></th>';
      html += '</tr></thead><tbody>';
      for(let r = 0; r <= maxRow; r++) {
        html += `<tr><td style="background:#f1f0ec;border:1px solid #d8d5cd;font-weight:600;color:#6b6758;font-size:11px;text-align:center;min-width:34px;position:sticky;left:0;z-index:1">${r+1}</td>`;
        for(let c = 0; c <= maxCol; c++) {
          const merged = isMerged(r, c);
          if(merged && !isMergeHead(r, c)) continue; // skip cells covered by a merge
          const addr = XLSX.utils.encode_cell({ r, c });
          const cell = ws[addr];
          let val = cell ? (cell.w !== undefined ? cell.w : cell.v) : '';
          if(val === undefined || val === null) val = '';
          let span = '';
          if(merged && isMergeHead(r, c)) {
            const cs = merged.e.c - merged.s.c + 1;
            const rs = merged.e.r - merged.s.r + 1;
            if(cs > 1) span += ` colspan="${cs}"`;
            if(rs > 1) span += ` rowspan="${rs}"`;
          }
          // Detect numeric for right-alignment
          const isNum = cell && cell.t === 'n';
          const bold = cell && cell.s && cell.s.font && cell.s.font.bold;
          const w = widthOf(c);
          const hasFormula = cell && cell.f;
          const cellContent = hasFormula ? ('=' + cell.f) : (cell ? String(cell.v !== undefined ? cell.v : '') : '');
          const dataAttr = ` data-addr="${addr}" data-content="${String(cellContent).replace(/"/g,'&quot;')}"`;
          const formulaDot = hasFormula ? '<span style="position:absolute;top:2px;right:2px;width:4px;height:4px;background:#107c41;border-radius:50%"></span>' : '';
          html += `<td${span}${dataAttr} class="xls-cell" style="position:relative;border:1px solid #e2e0d8;padding:3px ${isMobileXls?6:8}px;height:22px;color:#18170f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:${w*2}px;text-align:${isNum?'right':'left'};cursor:cell;${bold?'font-weight:700;':''}">${String(val)}${formulaDot}</td>`;
        }
        html += '<td style="border:1px solid #e2e0d8;width:auto"></td>';
        html += '</tr>';
      }
      html += '</tbody></table>';
      return html;
    };

    const tabsHtml = sheetNames.map((name, i) =>
      `<button class="xls-tab" data-sheet="${i}" style="background:${i===activeSheet?'#fff':'rgba(255,255,255,0.08)'};color:${i===activeSheet?'#107c41':'rgba(255,255,255,0.7)'};border:none;padding:7px 16px;font-size:12px;font-weight:${i===activeSheet?'600':'500'};cursor:pointer;border-radius:7px 7px 0 0;white-space:nowrap">${name}</button>`
    ).join('');

    container.innerHTML = `
      <div class="xls-root" style="width:100%;flex:1;display:flex;flex-direction:column;${isMobileXls?'':'min-height:calc(100vh - 54px)'}">
        <div class="xls-fxbar" style="display:flex;align-items:center;gap:11px;margin:20px 20px 0;background:#fff;border-radius:12px 12px 0 0;padding:12px 16px;border-bottom:1px solid #eceae4">
          <div id="xls_addr" style="background:#e8f3ef;color:#107c41;font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;min-width:46px;text-align:center;letter-spacing:0.3px;transition:all 0.12s">—</div>
          <div style="width:1px;height:18px;background:#eceae4;flex-shrink:0"></div>
          <span style="font-style:italic;color:#c2bdb2;font-size:14px;font-weight:600;font-family:Georgia,serif;flex-shrink:0">fx</span>
          <span id="xls_formula" style="font-size:13px;color:#9a958a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-weight:450">Click a cell to see its value</span>
        </div>
        <div class="xls-sheet" style="background:#fff;flex:1;margin:0 20px;border-radius:0 0 12px 12px;overflow:auto;box-shadow:0 8px 40px rgba(0,0,0,0.4);max-height:calc(100vh - 180px)">
          <div id="xls_table" style="overflow:auto;width:100%;height:100%">${buildSheetTable(activeSheet)}</div>
        </div>
        ${sheetNames.length > 1 ? `<div style="display:flex;gap:4px;padding:14px 20px 16px;flex-wrap:wrap" id="xls_tabs">${tabsHtml}</div>` : '<div style="height:16px"></div>'}
      </div>
    `;

    // Cell click → show address + content/formula in the fx bar
    const addrBox = container.querySelector('#xls_addr');
    const formulaBox = container.querySelector('#xls_formula');
    let selectedCell = null;
    const attachCellHandlers = () => {
      container.querySelectorAll('.xls-cell').forEach(td => {
        td.onclick = () => {
          if(selectedCell) selectedCell.style.outline = '';
          selectedCell = td;
          td.style.outline = '2px solid #107c41';
          td.style.outlineOffset = '-1px';
          const addr = td.dataset.addr || '';
          const content = td.dataset.content || '';
          addrBox.textContent = addr || '—';
          if(content) {
            const isFormula = content.startsWith('=');
            formulaBox.textContent = content;
            formulaBox.style.color = isFormula ? '#107c41' : '#18170f';
            formulaBox.style.fontWeight = isFormula ? '600' : '500';
            formulaBox.style.fontFamily = isFormula ? "'SF Mono',ui-monospace,Menlo,monospace" : 'inherit';
            formulaBox.style.fontSize = isFormula ? '12.5px' : '13px';
          } else {
            formulaBox.textContent = 'Empty cell';
            formulaBox.style.color = '#c2bdb2';
            formulaBox.style.fontWeight = '450';
            formulaBox.style.fontFamily = 'inherit';
            formulaBox.style.fontSize = '13px';
          }
        };
      });
    };
    attachCellHandlers();

    if(sheetNames.length > 1) {
      container.querySelectorAll('.xls-tab').forEach(btn => {
        btn.onclick = () => {
          activeSheet = parseInt(btn.dataset.sheet);
          container.querySelector('#xls_table').innerHTML = buildSheetTable(activeSheet);
          selectedCell = null;
          addrBox.textContent = '—';
          formulaBox.textContent = 'Click a cell to inspect its value or formula';
          formulaBox.style.color = '#9a958a';
          formulaBox.style.fontWeight = '450';
          formulaBox.style.fontFamily = 'inherit';
          formulaBox.style.fontSize = '13px';
          attachCellHandlers();
          container.querySelectorAll('.xls-tab').forEach((b, i) => {
            b.style.background = i===activeSheet ? '#fff' : 'rgba(255,255,255,0.08)';
            b.style.color = i===activeSheet ? '#107c41' : 'rgba(255,255,255,0.7)';
            b.style.fontWeight = i===activeSheet ? '600' : '500';
          });
        };
      });
    }
  } catch(err) {
    console.warn('[FileSilver] Excel render failed:', err.message || err);
    container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:calc(100vh - 54px);color:rgba(255,255,255,0.5);font-size:13px;text-align:center;padding:40px">Could not load preview.<br>Try downloading the file instead.</div>`;
  }
}

  closeM();
  document.body.insertAdjacentHTML('beforeend', `<div class="ov" onclick="closeM()"><div class="mo" onclick="event.stopPropagation()" style="max-width:360px">
    <div class="mob" style="padding:24px 22px">
      <div style="text-align:center;margin-bottom:20px">
        <div style="margin-bottom:10px">${LOGO_MARK}</div>
        <div style="font-size:17px;font-weight:800;margin-bottom:3px">Welcome to FileSilver</div>
        <div style="font-size:12px;color:var(--tx3)">Sign in or create your free account</div>
      </div>
      <button class="bts" onclick="loginGoogle()">
        <img src="https://www.google.com/favicon.ico" style="width:16px;height:16px"> Continue with Google
      </button>
      <div class="adv"><div class="adv-l"></div><span>or continue with email</span><div class="adv-l"></div></div>
      <div id="AUTH_TABS">

function switchTab(t) {
  document.getElementById('tab_in').className='att'+(t==='in'?' on':'');

  document.getElementById('AUTH_FORM').innerHTML = t==='in'
    ? `<div class="fl"><label>Email</label><input id="AE" type="email" placeholder="you@example.com"></div>
       <div class="fl"><label>Password</label><input id="AP" type="password" placeholder="••••••••"></div>
       <button class="btn btna" style="width:100%;padding:9px;font-size:13px;margin-top:4px" onclick="doLogin()">Sign in</button>`
    : `<div class="fl"><label>Full name</label><input id="AN" type="text" placeholder="Jane Smith"></div>
       <div class="fl"><label>Email</label><input id="AE" type="email" placeholder="you@example.com"></div>
       <div class="fl"><label>Password</label><input id="AP" type="password" placeholder="Min. 8 characters"></div>
       <div class="fl"><label>Bio <span style="color:var(--tx3);font-weight:400">(optional)</span></label><input id="AB" type="text" placeholder="Tell the community about yourself…"></div>
       <button class="btn btna" style="width:100%;padding:9px;font-size:13px;margin-top:4px" onclick="doRegister()">Create account</button>`;
}

async function loginGoogle() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
  if(error) toast(error.message, false);
}

async function doLogin() {
  const e=document.getElementById('AE')?.value||'';
  const p=document.getElementById('AP')?.value||'';
  if(!e||!p){toast('Fill all fields.',false);return;}
  const {error}=await sb.auth.signInWithPassword({email:e,password:p});
  if(error){toast(error.message,false);return;}
  closeM(); toast('Welcome back!',true);
}

async function doRegister() {
  const n=document.getElementById('AN')?.value||'';
  const e=document.getElementById('AE')?.value||'';
  const p=document.getElementById('AP')?.value||'';
  const b=document.getElementById('AB')?.value||'';
  if(!n||!e||!p){toast('Fill all fields.',false);return;}
  const {error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});
  if(error){toast(error.message,false);return;}
  if(b) await sb.from('profiles').update({bio:b}).eq('email',e);
  closeM(); toast('Account created! Check your email to confirm.',true);

async function doLogout() {
  await sb.auth.signOut();
  S.user=null; S.profile=null; S.page='home';
  toast('Signed out.');

}

// ── UPLOAD ──
function openUp() {
  if(!S.user){openAuth();return;}
  S.tags=[];S.uploadType='word';
  document.body.insertAdjacentHTML('beforeend', `<div class="ov" onclick="closeM()"><div class="mo" onclick="event.stopPropagation()" style="max-width:440px">
    <div class="moh"><div style="font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px">${ic('upload',13)} Upload a document</div><button class="mox" onclick="closeM()">${ic('close',14)}</button></div>
    <div class="mob">
      <input type="file" id="FILE_INPUT" accept=".docx,.xlsx,.pptx,.pdf" onchange="fileChosen(this)">
      <div class="drp" id="DRZ" onclick="document.getElementById('FILE_INPUT').click()"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')"
        ondrop="event.preventDefault();this.classList.remove('drag');fileChosen({files:event.dataTransfer.files})">
        ${ic('upload',24,'display:block;margin:0 auto 6px;stroke:var(--tx3)')}
        <p id="DRL"><strong>Click to select</strong> or drag & drop</p>
        <div class="ht">.docx · .xlsx · .pptx · .pdf — max 50MB</div>
      </div>
      <div class="fl"><label>Title *</label><input id="UPT" type="text" placeholder="E.g. Annual Sales Report 2025"></div>
      <div class="fl"><label>Description</label><textarea id="UPD" placeholder="Briefly describe the document…"></textarea></div>
      <div class="fl"><label>Tags</label>
        <div class="tag-wrap" onclick="document.getElementById('TGI').focus()">
          <div id="TGC"></div>
          <input id="TGI" class="tag-inp" placeholder="Type and press Enter…" onkeydown="handleTag(event)">
        </div>
        <div class="fh">Press Enter or comma to add a tag</div>
      </div>
      <div id="UP_PROG" style="display:none"><div class="prog"><div class="prog-bar" id="PROG_BAR" style="width:0%"></div></div><div style="font-size:10.5px;color:var(--tx3);margin-top:4px" id="PROG_TXT">Uploading…</div></div>
      <button class="btn btna" style="width:100%;padding:8px;font-size:13px;margin-top:4px" id="UP_BTN" onclick="doUpload()">Publish document</button>

let selectedFile = null;
function fileChosen(inp) {
  const files = inp.files;
  if(!files||!files.length) return;
  const f = files[0];
  selectedFile = f;
  const ext = f.name.split('.').pop().toLowerCase();
  const typeMap = {docx:'word',xlsx:'excel',pptx:'ppt',pdf:'pdf'};
  S.uploadType = typeMap[ext] || 'word';
  document.getElementById('DRL').innerHTML = `<strong>${f.name}</strong> (${(f.size/1024/1024).toFixed(1)} MB)`;
  document.getElementById('DRZ').classList.add('ok');
  const t = document.getElementById('UPT');
  if(t&&!t.value) t.value = f.name.replace(/\.(docx|xlsx|pptx|pdf)$/i,'');
}

function handleTag(e) {
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    const v=e.target.value.trim().replace(/,/g,'').toLowerCase();
    if(v&&!S.tags.includes(v)){S.tags.push(v);e.target.value='';rTags();}
  }
}
function removeTag(t){S.tags=S.tags.filter(x=>x!==t);rTags();}
function rTags(){const el=document.getElementById('TGC');if(el)el.innerHTML=S.tags.map(t=>`<span class="tag-chip">${t}<button onclick="removeTag('${t}')">×</button></span>`).join('');}

async function doUpload() {
  const title = document.getElementById('UPT')?.value?.trim()||'';
  const desc = document.getElementById('UPD')?.value?.trim()||'';
  if(!title){toast('Please add a title.',false);return;}
  if(!selectedFile){toast('Please select a file.',false);return;}
  const btn = document.getElementById('UP_BTN');
  const prog = document.getElementById('UP_PROG');
  btn.disabled=true;btn.textContent='Uploading…';
  prog.style.display='block';
  const bar = document.getElementById('PROG_BAR');
  const txt = document.getElementById('PROG_TXT');
  // Upload file to Supabase Storage
  const fileName = `${S.user.id}/${Date.now()}_${selectedFile.name}`;
  bar.style.width='30%';txt.textContent='Uploading file…';
  const { data: fileData, error: fileErr } = await sb.storage.from('documents').upload(fileName, selectedFile, {contentType: selectedFile.type});
  if(fileErr){toast('Upload failed: '+fileErr.message,false);btn.disabled=false;btn.textContent='Publish document';return;}
  bar.style.width='70%';txt.textContent='Saving metadata…';
  const { data: urlData } = sb.storage.from('documents').getPublicUrl(fileName);
  const { error: dbErr } = await sb.from('documents').insert({
    title, description: desc, file_type: S.uploadType,
    file_url: urlData.publicUrl, file_name: selectedFile.name,
    tags: S.tags, user_id: S.user.id
  });
  if(dbErr){toast('Error saving document.',false);btn.disabled=false;return;}
  bar.style.width='100%';txt.textContent='Done!';
  selectedFile=null;S.tags=[];
  setTimeout(()=>{closeM();toast('Published!',true);S.page='home';render();},400);
}

// ── EDIT PROFILE ──
function openEditP() {
  const u = S.profile;
  document.body.insertAdjacentHTML('beforeend', `<div class="ov" onclick="closeM()"><div class="mo" onclick="event.stopPropagation()" style="max-width:360px">
    <div class="moh"><div style="font-weight:700;font-size:13px">${ic('edit',13)} Edit profile</div><button class="mox" onclick="closeM()">${ic('close',14)}</button></div>
    <div class="mob">
      <div class="fl"><label>Full name</label><input id="EN" type="text" value="${u.name||''}"></div>
      <div class="fl"><label>Bio</label><textarea id="EB">${u.bio||''}</textarea></div>
      <button class="btn btna" style="width:100%;padding:8px;font-size:13px" onclick="saveProfile()">Save changes</button>
    </div>
  </div></div>`);
}

async function saveProfile() {
  const name = document.getElementById('EN')?.value||'';
  const bio = document.getElementById('EB')?.value||'';
  const { error } = await sb.from('profiles').update({name,bio}).eq('id',S.user.id);
  if(error){toast('Error saving.',false);return;}
  S.profile = {...S.profile,name,bio};
  closeM(); toast('Profile updated!',true); render();
}

// ── NAVIGATION ──
function goto(p){
  S.page=p;S.vu=null;S.search='';S.docId=null;
  if(window.location.pathname !== '/') history.pushState({}, '', '/');
  closeSidebar();
  render();
}
function setTF(f){S.tf=f;if(!['home','trending','explore'].includes(S.page))S.page='home';closeSidebar();render();}
function setSort(v){S.sort=v;render();}
let _searchT;
function doSearch(v){
  S.search=v;S.page='home';S.docId=null;
  if(window.location.pathname !== '/') history.pushState({}, '', '/');
  // Re-render only the content area (not the navbar) so the search input keeps focus.
  // Debounced to avoid rebuilding on every keystroke.
  clearTimeout(_searchT);
  _searchT = setTimeout(async () => {
    try { await buildApp(); } catch(e){ console.error(e); }
    setTimeout(initLazyPreviews, 100);
  }, 180);
}
function goUser(uid){
  if(S.user&&uid===S.user.id){goto('profile');return;}
  S.page='user';S.vu=uid;S.docId=null;
  if(window.location.pathname !== '/') history.pushState({}, '', '/');
  render();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});

// ── LAZY PREVIEW ──
function initLazyPreviews() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(el => {
      if(el.isIntersecting) {
        const div = el.target;
        const url = div.dataset.url;
        const ftype = div.dataset.ftype;
        const thumb = div.dataset.thumb;
        if(url && !div.dataset.loaded) {
          div.dataset.loaded = '1';
          // Priority: 1) thumbnail image if available, 2) PDF.js for PDFs on Supabase, 3) styled card
          if(thumb) {
            renderThumbnailImage(div, thumb, ftype);
          } else {
            const isSupabase = url.indexOf('supabase.co/storage') !== -1;
            if(ftype === 'pdf' && isSupabase) {
              renderPdfThumbnail(div, url);
            } else {
              renderStyledCard(div, ftype);
            }
          }
          observer.unobserve(div);
        }
      }
    });
  }, { rootMargin: '150px', threshold: 0.05 });

  document.querySelectorAll('.lazy-preview').forEach(el => observer.observe(el));
}

function renderThumbnailImage(container, thumbUrl, ftype) {
  const img = new Image();
  img.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:top;border-radius:10px;display:block';
  img.onload = () => {
    container.innerHTML = '';
    container.appendChild(img);
  };
  img.onerror = () => {
    // Fallback to styled card if thumbnail fails to load
    renderStyledCard(container, ftype);
  };
  img.src = thumbUrl;
}

async function renderPdfThumbnail(container, url) {
  try {
    if(!window.pdfjsLib) { 
      console.warn('[FileSilver] PDF.js non caricato, fallback card');
      renderStyledCard(container, 'pdf'); 
      return; 
    }
    const loadingTask = pdfjsLib.getDocument({ url: url, disableRange: true, disableStream: true });
    const pdf = await loadingTask.promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 1 });
    // Risoluzione alta per Retina display (devicePixelRatio 2x o 3x)
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const targetWidth = 700;
    const scale = (targetWidth / viewport.width) * dpr;
    const scaledViewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = scaledViewport.width;
    canvas.height = scaledViewport.height;
    canvas.style.cssText = 'width:100%;height:100%;object-fit:cover;object-position:top;border-radius:10px;display:block';
    await page.render({ canvasContext: ctx, viewport: scaledViewport }).promise;
    container.innerHTML = '';
    container.appendChild(canvas);
  } catch(err) {
    console.warn('[FileSilver] PDF preview failed for', url, '→', err.message || err);
    renderStyledCard(container, 'pdf');
  }
}

function renderStyledCard(container, ftype) {
  const config = {
    word:  { c:'#2b5797', icon:'W' },
    excel: { c:'#107c41', icon:'X' },
    ppt:   { c:'#c43e1c', icon:'P' },
    pdf:   { c:'#b91c1c', icon:'P' }
  };
  const c = config[ftype] || config.pdf;
  container.innerHTML = `
    <div style="width:100%;height:100%;background:#f5f4f1;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,0.6) 0%, transparent 50%)"></div>
      <div style="font-size:110px;font-weight:900;color:${c.c};font-family:-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-4px;opacity:0.92;position:relative;line-height:1">${c.icon}</div>
      <div style="position:absolute;bottom:0;left:0;right:0;height:4px;background:${c.c}"></div>
    </div>
  `;
}

init();
